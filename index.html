<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>邮件朗读</title>
  <style>
    :root {
      --accent: #002FA7;                 /* 克莱因蓝 RGB(0,47,167) */
      --accent-ink: #002FA7;             /* 裸图标/文字用色（浅色下同克莱因蓝） */
      --accent-dim: rgba(0, 47, 167, 0.14);
      --bg: #fff;
      --fg: #000;
      --sec: #999;
      --divider: rgba(0, 0, 0, 0.1);
    }
    body.dark-mode {
      --accent-ink: #7A93FF;             /* 仅纯黑底上的裸图标/文字提亮，保证可读 */
      --accent-dim: rgba(0, 47, 167, 0.28);
      --bg: #000;
      --fg: #fff;
      --sec: #777;
      --divider: rgba(255, 255, 255, 0.1);
    }

    * {
      margin: 0; padding: 0; box-sizing: border-box; -webkit-font-smoothing: antialiased;
      scrollbar-width: none; -ms-overflow-style: none;   /* 去掉滚动栏 */
      touch-action: manipulation;                         /* 禁止双击缩放，点击更跟手 */
    }
    *::-webkit-scrollbar { display: none; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', sans-serif;
      background: var(--bg);
      color: var(--fg);
      overflow: hidden;
      position: fixed;
      width: 100%;
      height: 100%;
    }

    .app { display: flex; flex-direction: column; height: 100vh; height: 100dvh; }
    .container { display: flex; flex-direction: column; height: 100vh; height: 100dvh; max-width: 100%; }

    /* ===== 顶栏 ===== */
    .topbar {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      padding: max(14px, env(safe-area-inset-top)) 20px 10px;
      flex-shrink: 0;
    }
    .topbar-actions { display: flex; gap: 18px; align-items: center; }

    .icon-btn {
      background: none; border: none;
      color: var(--fg);
      padding: 4px; cursor: pointer;
      display: inline-flex; align-items: center; justify-content: center;
      opacity: 0.85;
      transition: opacity 0.15s, transform 0.15s;
      -webkit-tap-highlight-color: transparent;
    }
    .icon-btn:active { opacity: 0.5; transform: scale(0.9); }

    /* ===== 封面 + 标题（无渐变） ===== */
    .meta {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 4px 20px 12px;
      flex-shrink: 0;
    }
    .art {
      width: 76px; height: 76px;
      border-radius: 16px;
      flex-shrink: 0;
      background: var(--accent);
      display: flex; align-items: center; justify-content: center;
      font-size: 30px; font-weight: 600; color: #fff;
      overflow: hidden;
      cursor: pointer;
      box-shadow: 0 6px 18px rgba(0, 47, 167, 0.25);
      will-change: transform;
    }
    .art img { width: 100%; height: 100%; object-fit: cover; display: none; }
    .meta-text { flex: 1; min-width: 0; }
    .title { font-size: 17px; font-weight: 700; letter-spacing: -0.2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .subtitle { font-size: 13px; color: var(--sec); margin-top: 3px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    /* 封面放大视图（点克莱因蓝方块） */
    .content-area, .sections { transition: opacity 0.22s ease; }
    .app.focus .content-area,
    .app.focus .sections { opacity: 0; pointer-events: none; }
    .app.focus .content-area { flex: 0; overflow: hidden; padding: 0; }
    .app.focus .sections { display: none; }
    .app.focus .meta { flex: 1; flex-direction: column; align-items: center; justify-content: center; gap: 22px; padding: 24px; }
    .app.focus .art { width: min(78vw, 340px); height: min(78vw, 340px); border-radius: 24px; }
    .app.focus .meta-text { flex: none; text-align: center; max-width: 90%; }
    .app.focus .title { white-space: normal; font-size: 20px; }

    /* ===== 段落标签（换行，不横向滚动） ===== */
    .sections-row {
      display: flex;
      align-items: flex-start;
      gap: 4px;
      padding: 2px 12px 10px 20px;
      flex-shrink: 0;
    }
    .sections {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      flex: 1;
      min-width: 0;
      overflow: hidden;
      transition: max-height 0.28s ease;
      max-height: 400px;
    }
    .sections-toggle {
      background: none; border: none;
      color: var(--sec);
      cursor: pointer;
      padding: 5px 2px;
      flex-shrink: 0;
      display: inline-flex; align-items: center; justify-content: center;
      -webkit-tap-highlight-color: transparent;
    }
    .sections-toggle:active { opacity: 0.5; }
    .section-btn {
      padding: 6px 13px;
      border-radius: 16px;
      border: none;
      font-size: 12px; font-weight: 500;
      white-space: nowrap; cursor: pointer;
      background: rgba(128, 128, 128, 0.12);
      color: var(--sec);
      transition: all 0.2s ease;
      -webkit-tap-highlight-color: transparent;
    }
    .section-btn.active { background: var(--accent); color: #fff; }

    /* ===== 正文（分段 + 居中限宽） ===== */
    .content-area {
      flex: 1;
      overflow-y: auto;
      padding: 8px 20px 16px;
      -webkit-overflow-scrolling: touch;
    }
    .text-content {
      font-family: Georgia, 'Times New Roman', 'Songti SC', 'Noto Serif SC', 'SimSun', serif;
      font-size: 18px;
      line-height: 1.9;
      letter-spacing: -0.1px;
      max-width: 90%;
      margin: 0 auto;
      overflow-wrap: anywhere;
      word-break: break-word;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }
    .para {
      margin: 0 0 1.1em;
      overflow-wrap: anywhere;
      word-break: break-word;
    }
    .word {
      transition: opacity 0.25s ease, font-size 0.25s ease, background 0.15s ease, color 0.15s ease;
      padding: 1px 2px;
      border-radius: 4px;
      opacity: 0.4;              /* 未读：半透明 */
    }
    .word.read { opacity: 1; font-size: 1.05em; }   /* 已读：实体 + 放大半号 */
    .word.selected { background: var(--accent); color: #fff; opacity: 1; font-weight: 600; }
    .word.en { cursor: pointer; }

    /* ===== 底部控制 ===== */
    .controls {
      padding: 12px 20px max(16px, env(safe-area-inset-bottom));
      border-top: 0.5px solid var(--divider);
      flex-shrink: 0;
    }
    .progress-wrap { margin-bottom: 10px; }
    .progress-bar {
      width: 100%;
      height: 3px;
      background: rgba(128, 128, 128, 0.25);
      border-radius: 2px;
      cursor: pointer;
      appearance: none; -webkit-appearance: none;
      outline: none;
      margin-bottom: 6px;
    }
    .progress-bar::-webkit-slider-thumb {
      appearance: none; -webkit-appearance: none;
      width: 14px; height: 14px; border-radius: 50%;
      background: var(--accent); cursor: pointer;
    }
    .progress-bar::-moz-range-thumb {
      width: 14px; height: 14px; border-radius: 50%;
      background: var(--accent); cursor: pointer; border: none;
    }
    .progress-bar::-webkit-slider-runnable-track {
      background: linear-gradient(to right, var(--accent) 0%, var(--accent) var(--progress, 0%), rgba(128,128,128,0.25) var(--progress, 0%), rgba(128,128,128,0.25) 100%);
      height: 3px; border-radius: 2px;
    }
    .time-display { display: flex; justify-content: space-between; font-size: 12px; color: var(--sec); }

    .transport { display: flex; align-items: center; justify-content: center; gap: 44px; margin-bottom: 8px; }
    .t-btn {
      background: none; border: none;
      color: var(--fg);
      cursor: pointer;
      padding: 6px;
      display: inline-flex; align-items: center; justify-content: center;
      opacity: 0.9;
      transition: opacity 0.15s, transform 0.15s;
      -webkit-tap-highlight-color: transparent;
    }
    .t-btn:active { opacity: 0.5; transform: scale(0.9); }
    .t-btn.play { color: var(--accent-ink); }
    .t-btn.speed { font-size: 13px; font-weight: 600; color: var(--fg); }
    .t-btn.timer { flex-direction: column; gap: 1px; position: relative; }
    .t-btn.timer.active { color: var(--accent-ink); }
    .timer-label { font-size: 10px; color: var(--sec); font-weight: 500; }

    /* ===== 邮件列表：右侧边栏（从右侧滑入，不再从下方弹出） ===== */
    .email-list {
      position: fixed;
      top: 0; right: 0; bottom: 0;
      width: max(200px, 33vw);
      background: var(--bg);
      border-left: 0.5px solid var(--divider);
      transform: translateX(101%);
      transition: transform 0.3s cubic-bezier(0.22, 1, 0.36, 1);
      z-index: 40;
      display: flex; flex-direction: column;
      overflow: hidden;
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
      box-shadow: -10px 0 30px rgba(0, 0, 0, 0.13);
    }
    .email-list.open { transform: translateX(0); }
    .list-header { display: flex; align-items: center; justify-content: space-between; padding: 14px 20px 6px; flex-shrink: 0; }
    .list-header-title { font-size: 15px; font-weight: 700; }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; padding: 8px 20px; flex-shrink: 0; }
    .chip {
      padding: 6px 14px; border-radius: 16px; border: none;
      background: rgba(128, 128, 128, 0.12); color: var(--sec);
      font-size: 13px; white-space: nowrap; cursor: pointer;
      transition: all 0.2s ease;
    }
    .chip.active { background: var(--accent); color: #fff; }
    .list-body { flex: 1; overflow-y: auto; padding: 4px 10px 12px; -webkit-overflow-scrolling: touch; }
    .email-item { padding: 12px 14px; border-radius: 12px; cursor: pointer; margin: 2px 0; }
    .email-item:active { background: var(--accent-dim); }
    .email-item.active { background: var(--accent-dim); }
    .email-sender { font-size: 15px; font-weight: 600; }
    .email-title { font-size: 13px; color: var(--sec); margin-top: 3px; }
    .email-date { font-size: 11px; color: var(--sec); opacity: 0.7; margin-top: 3px; }
    .list-empty { padding: 28px; text-align: center; color: var(--sec); font-size: 13px; }

    .list-backdrop {
      position: fixed; inset: 0;
      background: rgba(0, 0, 0, 0.35);
      opacity: 0; pointer-events: none;
      transition: opacity 0.25s ease;
      z-index: 30;
    }
    .list-backdrop.show { opacity: 1; pointer-events: auto; }

    /* ===== 导入面板 ===== */
    .import-panel {
      position: fixed; inset: 0;
      background: rgba(0, 0, 0, 0.45);
      z-index: 50;
      display: none; align-items: center; justify-content: center; padding: 20px;
    }
    .import-panel.open { display: flex; }
    .import-box {
      background: var(--bg);
      border: 0.5px solid var(--divider);
      border-radius: 16px;
      padding: 20px; width: 100%; max-width: 480px; max-height: 85vh; overflow-y: auto;
    }
    .import-box h3 { font-size: 16px; margin-bottom: 14px; }
    .import-box textarea, .import-row input[type=text] {
      width: 100%;
      border: 0.5px solid var(--divider);
      border-radius: 10px;
      padding: 12px; font-size: 14px;
      background: var(--bg); color: var(--fg);
      font-family: inherit; line-height: 1.6;
    }
    .import-box textarea { height: 140px; resize: vertical; }
    .import-row { display: flex; gap: 8px; margin-top: 12px; }
    .import-row input[type=text] { flex: 1; }
    .btn {
      border: none; border-radius: 10px; padding: 10px 16px;
      font-size: 14px; font-weight: 600; cursor: pointer; white-space: nowrap;
      -webkit-tap-highlight-color: transparent;
    }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-ghost { background: rgba(128, 128, 128, 0.14); color: var(--fg); }
    .import-file { margin-top: 12px; font-size: 13px; color: var(--sec); display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .import-hint { font-size: 12px; color: var(--sec); margin-top: 12px; line-height: 1.7; }
    .import-actions { display: flex; gap: 8px; margin-top: 16px; justify-content: flex-end; }

    /* ===== toast ===== */
    .toast {
      position: fixed; left: 50%; bottom: 90px;
      transform: translateX(-50%) translateY(20px);
      background: rgba(0, 0, 0, 0.82); color: #fff;
      padding: 11px 18px; border-radius: 22px; font-size: 13px;
      opacity: 0; pointer-events: none;
      transition: all 0.3s ease; z-index: 60;
      max-width: 84%; text-align: center;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* ===== 词典小浮窗 ===== */
    .dict-pop {
      position: fixed;
      z-index: 50;
      width: 280px;
      max-width: 84vw;
      max-height: 46vh;
      overflow-y: auto;
      background: var(--bg);
      border: 0.5px solid var(--divider);
      border-radius: 14px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.2);
      padding: 14px 16px;
      display: none;
      scrollbar-width: none;
    }
    .dict-pop.open { display: block; }
    .dict-pop::-webkit-scrollbar { display: none; }
    .dict-word { font-size: 20px; font-weight: 700; margin-bottom: 2px; padding-right: 24px; }
    .dict-phonetic { font-size: 13px; color: var(--sec); margin-bottom: 10px; }
    .dict-cn { font-size: 14px; font-weight: 600; color: var(--fg); margin-bottom: 8px; }
    .dict-meaning { margin-bottom: 10px; }
    .dict-pos { font-size: 12px; color: var(--accent-ink); font-weight: 600; margin-bottom: 2px; }
    .dict-def { font-size: 14px; line-height: 1.5; margin-bottom: 2px; }
    .dict-def .num { color: var(--sec); margin-right: 4px; }
    .dict-def-cn { font-size: 13px; color: var(--fg); opacity: 0.82; margin: 2px 0 2px 14px; line-height: 1.5; }
    .dict-example { font-size: 12px; color: var(--sec); font-style: italic; margin: 2px 0 0 14px; line-height: 1.5; }
    .dict-actions {
      display: flex; gap: 12px; align-items: center;
      margin-top: 10px; padding-top: 10px;
      border-top: 0.5px solid var(--divider);
    }
    .dict-action {
      background: none; border: none; color: var(--fg);
      cursor: pointer; padding: 4px;
      display: inline-flex; align-items: center; justify-content: center;
      opacity: 0.9; transition: opacity 0.15s;
      -webkit-tap-highlight-color: transparent;
    }
    .dict-action:active { opacity: 0.5; }
    .dict-close {
      position: absolute; top: 12px; right: 14px;
      font-size: 16px; color: var(--sec);
      cursor: pointer; background: none; border: none;
    }

    /* ===== 声音选择 ===== */
    .voice-pop {
      position: fixed;
      top: 56px; right: 14px;
      z-index: 52;
      width: 250px;
      max-height: 52vh;
      overflow-y: auto;
      background: var(--bg);
      border: 0.5px solid var(--divider);
      border-radius: 14px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.2);
      padding: 12px;
      display: none;
      scrollbar-width: none;
    }
    .voice-pop.open { display: block; }
    .voice-pop::-webkit-scrollbar { display: none; }
    .voice-title { font-size: 13px; font-weight: 700; color: var(--sec); margin-bottom: 8px; }
    .voice-item { padding: 8px 10px; border-radius: 8px; cursor: pointer; font-size: 14px; line-height: 1.4; }
    .voice-item:active { background: var(--accent-dim); }
    .voice-item.active { background: var(--accent-dim); color: var(--accent-ink); font-weight: 600; }

    /* ===== Obsidian 设置 ===== */
    .obs-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.4); opacity: 0; pointer-events: none; transition: opacity 0.25s; z-index: 53; }
    .obs-backdrop.show { opacity: 1; pointer-events: auto; }
    .obs-pop {
      position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%);
      width: 320px; max-width: 88vw;
      background: var(--bg); border: 0.5px solid var(--divider); border-radius: 16px;
      box-shadow: 0 16px 40px rgba(0,0,0,0.25); padding: 18px; z-index: 54;
      display: none;
    }
    .obs-pop.open { display: block; }
    .obs-title { font-size: 15px; font-weight: 700; margin-bottom: 14px; }
    .obs-row { margin-bottom: 10px; }
    .obs-row label { display: block; font-size: 12px; color: var(--sec); margin-bottom: 4px; }
    .obs-row input {
      width: 100%; border: 0.5px solid var(--divider); border-radius: 10px;
      padding: 10px 12px; font-size: 14px; background: var(--bg); color: var(--fg); font-family: inherit;
    }
    .obs-hint { font-size: 11px; color: var(--sec); margin: 4px 0 14px; line-height: 1.6; }
    .obs-actions { display: flex; gap: 8px; justify-content: flex-end; }

    /* ===== 宽屏：右侧边栏常驻，可收缩 ===== */
    @media (min-width: 760px) {
      .app { flex-direction: row; }
      .container { flex: 1; min-width: 0; }
      .email-list {
        position: static; transform: none;
        width: 33vw; min-width: 240px; height: 100vh;
        border-left: 0.5px solid var(--divider);
        padding-top: 0; padding-bottom: 0;
        box-shadow: none;
        transition: width 0.28s cubic-bezier(0.22, 1, 0.36, 1);
      }
      .email-list.collapsed { width: 0; border-left: none; overflow: hidden; }
      .list-backdrop { display: none; }
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="container">
      <header class="topbar">
        <div class="topbar-actions">
          <button class="icon-btn" id="importBtn" title="导入">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M4 19h16"/></svg>
          </button>
          <button class="icon-btn" id="voiceBtn" title="选择声音">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5L6 9H2v6h4l5 4V5z" fill="currentColor" stroke="none"/><path d="M15 9a4 4 0 0 1 0 6"/><path d="M18 6a8 8 0 0 1 0 12"/></svg>
          </button>
          <button class="icon-btn" id="listToggleBtn" title="邮件列表">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
          </button>
        </div>
      </header>

      <div class="meta">
        <div class="art" id="artBtn">
          <img id="episodeImg" alt="">
          <span id="imgPlaceholder"></span>
        </div>
        <div class="meta-text">
          <div class="title" id="episodeTitle"></div>
          <div class="subtitle" id="episodeSubtitle"></div>
        </div>
      </div>

      <div class="sections-row" id="sectionsRow">
        <div class="sections" id="sectionsContainer"></div>
        <button class="sections-toggle" id="sectionsToggle" title="收起/展开小标题"></button>
      </div>

      <main class="content-area">
        <div class="text-content" id="textContent"></div>
      </main>

      <footer class="controls">
        <div class="progress-wrap">
          <input type="range" class="progress-bar" id="progressBar" min="0" max="100" value="0">
          <div class="time-display">
            <span id="currentTime">0:00</span>
            <span id="totalTime">0:00</span>
          </div>
        </div>
        <div class="transport">
          <button class="t-btn speed" id="speedBtn" title="倍速"><span id="speedDisplay">1.0x</span></button>
          <button class="t-btn skip" id="rewindBtn" title="后退10秒">
            <svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M15.75 5.505 A7.5 7.5 0 1 1 8.25 5.505"/><path d="M10.7 3.5 L7.95 5.505 L10.7 7.5"/><text x="12" y="14.3" text-anchor="middle" font-size="6.4" fill="currentColor" stroke="none" font-weight="700" font-family="-apple-system,sans-serif">10</text></svg>
          </button>
          <button class="t-btn play" id="playBtn" title="播放"><span id="playIcon"></span></button>
          <button class="t-btn skip" id="forwardBtn" title="前进10秒">
            <svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M15.75 5.505 A7.5 7.5 0 1 1 8.25 5.505"/><path d="M13.3 3.5 L16.05 5.505 L13.3 7.5"/><text x="12" y="14.3" text-anchor="middle" font-size="6.4" fill="currentColor" stroke="none" font-weight="700" font-family="-apple-system,sans-serif">10</text></svg>
          </button>
          <button class="t-btn timer" id="timerBtn" title="定时">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2.5"/><path d="M9 2h6"/></svg>
            <span id="timerLabel" class="timer-label"></span>
          </button>
        </div>
      </footer>
    </div>

    <aside class="email-list" id="emailList">
      <div class="list-header">
        <div class="list-header-title">邮件列表</div>
        <button class="icon-btn" id="listCloseBtn">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
      <div class="chips" id="senderChips"></div>
      <div class="list-body" id="emailListBody"></div>
    </aside>
  </div>

  <div class="list-backdrop" id="listBackdrop"></div>

  <div class="import-panel" id="importPanel">
    <div class="import-box">
      <h3>导入</h3>
      <textarea id="importText" placeholder="粘贴正文 / Markdown / HTML"></textarea>

  <script>
    // ==================== 输入解析 ====================
    const params = new URLSearchParams(window.location.search);

    // ==================== DOM 引用 ====================
    const progressBar = document.getElementById('progressBar');

    const dictSpeakBtn = document.getElementById('dictSpeakBtn');
    const dictSaveBtn = document.getElementById('dictSaveBtn');
    const dictSettingsBtn = document.getElementById('dictSettingsBtn');
    const dictClose = document.getElementById('dictClose');
    const voiceBtn = document.getElementById('voiceBtn');

    const obsBackdrop = document.getElementById('obsBackdrop');

    const obsSave = document.getElementById('obsSave');

    const PLAY_SVG = '<svg viewBox="0 0 24 24" width="40" height="40"><path d="M8 5v14l11-7z" fill="currentColor"/></svg>';
    const PAUSE_SVG = '<svg viewBox="0 0 24 24" width="40" height="40"><path d="M7 5h4v14H7zM13 5h4v14h-4z" fill="currentColor"/></svg>';

    // ==================== 状态 ====================
    const state = { emails: [], currentEmailIndex: 0, senderFilter: null, senders: [] };
    let speed = 1.0;
    let fullText = '';
    let allWords = [];
    let paragraphRanges = [];       // [{start, end}] 词下标区间
    let sectionRanges = [];
    let currentWordIndex = 0;
    let mode = 'stopped';
    let estimatedDuration = 60;
    let utterance = null;
    let speechStartChar = 0;
    let fallbackRAF = null;
    let fallbackStartTime = 0;
    let fallbackStartProgress = 0;
    const selectedWords = new Set();

    const supportsTts = ('speechSynthesis' in window) && ('SpeechSynthesisUtterance' in window);
    function currentEmail() { return state.emails[state.currentEmailIndex]; }

    // Obsidian 配置：首次使用询问，之后记住（localStorage，各设备各自记一次）
    const OBSIDIAN_TEMPLATE = '- **{word}**：{zh}';
    function getObsidianConfig() {
      try { const raw = localStorage.getItem('obsidianConfig'); return raw ? JSON.parse(raw) : null; } catch (e) { return null; }
    }
    function setObsidianConfig(cfg) {
      try { localStorage.setItem('obsidianConfig', JSON.stringify(cfg)); } catch (e) {}
    }

    // ==================== 工具 ====================
    const TOKEN_RE = /[A-Za-z0-9]+(?:['’][A-Za-z0-9]+)*[.,!?;:]?|[一-鿿]|[^\s]/g;
    function tokenize(text) {
      const words = [];
      let m;
      while ((m = TOKEN_RE.exec(text)) !== null) {
        if (m[0].trim().length === 0) continue;
        words.push({ text: m[0], start: m.index, end: m.index + m[0].length });
      }
      return words;
    }
    function wordIndexAtChar(charIndex) {
      if (!allWords.length) return 0;
      let lo = 0, hi = allWords.length - 1, ans = 0;
      while (lo <= hi) {
        const mid = (lo + hi) >> 1;
        if (allWords[mid].start <= charIndex) { ans = mid; lo = mid + 1; }
        else hi = mid - 1;
      }
      return ans;
    }
    function formatTime(seconds) {
      const s = Math.max(0, Math.floor(seconds));
      return Math.floor(s / 60) + ':' + (s % 60).toString().padStart(2, '0');
    }
    let toastTimer = null;
    function showHint(msg) {
      toast.textContent = msg;
      toast.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove('show'), 2600);
    }
    // 把外部图片走 Worker 代理加载（绕开防盗链/网络限制），已是代理地址的跳过
    function proxifyImage(url) {
      if (!url) return '';
      if (url.indexOf(WORKER) === 0) return url;
      if (!/^https?:\/\//i.test(url)) return '';   // 相对路径/cid 无法代理
      return WORKER + '/v1/fetch?url=' + encodeURIComponent(url);
    }

    function setEpisodeImage(src) {
      if (!src) return;
      const p = proxifyImage(src);
      if (!p) return;
      episodeImg.src = p;
      episodeImg.style.display = 'block';
      imgPlaceholder.style.display = 'none';
    }
    function joinWords(words) {
      let out = '';
      for (let i = 0; i < words.length; i++) {
        if (i === 0) { out = words[0]; continue; }
        const prev = words[i - 1], cur = words[i];
        if (/^[.,!?;:。，！？；：)）\]】"'’]/.test(cur)) { out += cur; continue; }
        if (/[A-Za-z0-9]$/.test(prev) && /^[A-Za-z0-9]/.test(cur)) out += ' ' + cur;
        else out += cur;
      }
      return out.trim();
    }

    // 语言检测：判断正文以中文还是英文为主
    function detectLang(text) {
      const cjk = (text.match(/[一-鿿]/g) || []).length;
      const latin = (text.match(/[A-Za-z]/g) || []).length;
      return cjk > latin ? 'zh-CN' : 'en-US';
    }
    function pickVoice(lang) {
      const voices = speechSynthesis.getVoices();
      const prefix = lang.slice(0, 2).toLowerCase();
      const matching = voices.filter(v => v.lang && v.lang.toLowerCase().startsWith(prefix));
      if (!matching.length) return null;
      return matching.find(v => /enhanced|premium|siri|natural/i.test(v.name)) || matching[0];
    }
    function speakViaTts(text, lang) {
      if (!supportsTts) return;
      try { speechSynthesis.cancel(); } catch (e) {}
      const u = new SpeechSynthesisUtterance(text);
      u.lang = lang || 'en-US';
      const v = pickVoice(u.lang);
      if (v) u.voice = v;
      speechSynthesis.speak(u);
    }

    // 朗读单个单词：用独立音频元素，绝不干扰正文播放
    let wordAudio = null;
    function speakWord(word) {
      if (!word) return;
      if (wordAudio) { try { wordAudio.pause(); } catch (e) {} wordAudio = null; }
      const vp = VOICE_OPTIONS.find(v => v.id === voicePref) || VOICE_OPTIONS[0];
      if (vp.src === 'api') {
        const prevVoice = apiVoice;
        apiVoice = vp.id;
        synthesize(word).then(url => {
          apiVoice = prevVoice;
          if (wordAudio) { try { wordAudio.pause(); } catch (e) {} }
          wordAudio = new Audio(url);
          wordAudio.play().catch(() => {});
        }).catch(() => {
          apiVoice = prevVoice;
          speakViaTts(word, 'en-US');
        });
      } else {
        if (supportsTts) { try { speechSynthesis.cancel(); } catch (e) {} }
        const u = new SpeechSynthesisUtterance(word);
        u.lang = 'en-US';
        const sv = findSiriVoice(vp.id);
        if (sv) u.voice = sv;
        speechSynthesis.speak(u);
      }
    }

    // ==================== 声音选择 ====================
    const VOICE_OPTIONS = [
      { id: 'nova',     label: '女声 · AI (nova)',     src: 'api' },
      { id: 'onyx',     label: '男声 · AI (onyx)',     src: 'api' },
      { id: 'samantha', label: '女声 · Siri (Samantha)', src: 'siri' },
      { id: 'daniel',   label: '男声 · Siri (Daniel)',   src: 'siri' }
    ];
    let voicePref = (function () { try { return localStorage.getItem('voicePref') || 'nova'; } catch (e) { return 'nova'; } })();

    function findSiriVoice(namePart) {
      const voices = speechSynthesis.getVoices();
      const matches = voices.filter(v => v.name && v.name.toLowerCase().includes(namePart) && (v.lang || '').toLowerCase().startsWith('en'));
      return matches.find(v => /enhanced/i.test(v.name)) || matches[0] || null;
    }

    function renderVoices() {
      voiceList.innerHTML = '';
      VOICE_OPTIONS.forEach(v => {
        const item = document.createElement('div');
        item.className = 'voice-item' + (voicePref === v.id ? ' active' : '');
        item.textContent = v.label;
        item.addEventListener('click', () => {
          voicePref = v.id;
          try { localStorage.setItem('voicePref', v.id); } catch (e) {}
          renderVoices();
          voicePop.classList.remove('open');
          showHint('已切换：' + v.label);
        });
        voiceList.appendChild(item);
      });
    }

    voiceBtn.addEventListener('click', () => {
      renderVoices();
      voicePop.classList.toggle('open');
    });
    document.addEventListener('pointerdown', (e) => {
      if (!voicePop.classList.contains('open')) return;
      if (voicePop.contains(e.target) || voiceBtn.contains(e.target)) return;
      voicePop.classList.remove('open');
    });

    // ==================== 内容解析 ====================
    function looksLikeHtml(text) { return /<\s*(html|head|body|div|p|h[1-6]|span|a|img|table|article|section|li|ul|ol|br)\b/i.test(text); }
    function looksLikeMarkdown(text) { return /^#{1,6}\s+\S/m.test(text); }
    // 清洗正文：去掉 base64 内嵌图片、超长乱码串等
    function stripJunkText(t) {
      return (t || '')
        .replace(/data:[a-z]+\/[a-z0-9.+-]+;base64,[A-Za-z0-9+/=\s]+/gi, ' ')  // data:image/...;base64,xxx
        .replace(/!\[[^\]]*\]\(data:[^)]*\)/gi, ' ')                            // markdown 内嵌图片
        .replace(/cid:[^\s)"']+/gi, ' ')                                        // 邮件 cid 引用
        .replace(/[A-Za-z0-9+/]{200,}={0,2}/g, ' ')                             // 超长 base64 串
        .replace(/[ \t]{2,}/g, ' ')
        .replace(/\n{3,}/g, '\n\n')
        .trim();
    }

    // RTF → 纯文本（苹果邮件正文常是「RTF 包裹 HTML」）
    function rtfToText(raw) {
      const PL1 = '', PL2 = '', PL3 = '';
      let s = String(raw || '');
      // 1. 先保护转义字符，避免与 RTF 结构括号混淆
      s = s.split('\\\\').join(PL1);
      s = s.split('\\{').join(PL2);
      s = s.split('\\}').join(PL3);
      // 2. 去掉字体表/颜色表等非正文组
      s = s.replace(/\{\\(fonttbl|colortbl|stylesheet|info|pict|header|footer|footnote|listtable|rsidtbl|filetbl|revtbl)[\s\S]*?\}/g, '');
      // 3. 去掉可忽略组 {\*\...}
      s = s.replace(/\{\\\*[\s\S]*?\}/g, '');
      // 4. Unicode 转义 \uNNNN?
      s = s.replace(/\\u(-?\d+)\s?\??/g, (m, code) => {
        let n = parseInt(code, 10);
        if (n < 0) n += 65536;
        return String.fromCharCode(n);
      });
      // 5. cp1252 十六进制转义 \'xx
      const CP = { 0x82:'‚',0x83:'ƒ',0x84:'„',0x85:'…',0x86:'†',0x87:'‡',
        0x88:'ˆ',0x89:'‰',0x8A:'Š',0x8B:'‹',0x8C:'Œ',0x8E:'Ž',
        0x91:'‘',0x92:'’',0x93:'“',0x94:'”',0x95:'•',0x96:'–',0x97:'—',
        0x98:'˜',0x99:'™',0x9A:'š',0x9B:'›',0x9C:'œ',0x9E:'ž',0x9F:'Ÿ',0xA0:' ' };
      s = s.replace(/\\'([0-9a-fA-F]{2})/g, (m, hex) => {
        const b = parseInt(hex, 16);
        return b < 0x80 ? String.fromCharCode(b) : (CP[b] || ' ');
      });
      // 6. 段落/换行
      s = s.replace(/\\(par|line|pard|sect)\b/g, '\n');
      s = s.replace(/\\tab\b/g, '\t');
      // 7. 其余控制字
      s = s.replace(/\\[a-zA-Z]+-?\d*\s?/g, '');
      // 8. 去掉 RTF 结构括号
      s = s.replace(/[{}]/g, '');
      // 9. 还原被保护的转义字符
      s = s.split(PL1).join('\\').split(PL2).join('{').split(PL3).join('}');
      // 10. 清理空白
      s = s.replace(/[ \t]{2,}/g, ' ');
      s = s.replace(/\n{3,}/g, '\n\n');
      return s.trim();
    }

    function parseContent(text) {
      text = (text || '').trim();
      if (!text) return { subject: '', imageUrl: '', sections: [] };
      if (/^\{\\rtf/i.test(text)) text = rtfToText(text);
      let result;
      if (looksLikeHtml(text)) result = parseHtml(text);
      else if (looksLikeMarkdown(text)) result = parseMarkdown(text);
      else result = parsePlain(text);
      result.subject = stripJunkText(result.subject);
      (result.sections || []).forEach(s => { s.content = stripJunkText(s.content); });
      result.sections = (result.sections || []).filter(s => s.content || s.title);
      return result;
    }
    function parsePlain(text) {
      const lines = text.split(/\r?\n/).map(s => s.trim());
      const subject = lines.find(l => l) || '';
      const sections = [];
      let cur = { title: '', content: [] };
      for (const line of lines) {
        if (isHeadingLine(line)) {
          if (cur.content.length || cur.title) sections.push({ title: cur.title, content: cur.content.join('\n').trim() });
          cur = { title: line.replace(/^[\d一二三四五六七八九十]+[、.．)）]\s*/, '').trim(), content: [] };
          continue;
        }
        cur.content.push(line);
      }
      if (cur.content.length || cur.title) sections.push({ title: cur.title, content: cur.content.join('\n').trim() });
      if (!sections.length) sections.push({ title: '', content: text });
      return { subject, imageUrl: '', sections };
    }

    // 启发式识别标题行（编号、章节、全大写等）
    function isHeadingLine(line) {
      if (!line || line.length > 50) return false;
      if (/[。！？!?…,，;；:：]$/.test(line)) return false;
      if (/^\d+[、.．)）]/.test(line)) return true;
      if (/^[一二三四五六七八九十]+[、.．]/.test(line)) return true;
      if (/^(第[一二三四五六七八九十\d]+[章节部分])/.test(line)) return true;
      if (/^(Chapter|Section|Part)\s+\d+/i.test(line)) return true;
      if (/^[A-Z0-9\s'’\-&:：]{3,}$/.test(line) && /[A-Z]{2,}/.test(line)) return true;
      return false;
    }

    // 无标题段落自动取前 12 字作标题
    function autoTitle(content) {
      const t = (content || '').trim().replace(/\s+/g, ' ');
      return t ? (t.slice(0, 12) + (t.length > 12 ? '…' : '')) : '正文';
    }
    function parseMarkdown(text) {
      const lines = text.split(/\r?\n/);
      let subject = '', imageUrl = '';
      const sections = [];
      let cur = null;
      const flush = () => { if (cur) sections.push({ title: cur.title, content: cur.content.join('\n').trim(), image: cur.image || '' }); cur = null; };
      for (const raw of lines) {
        const line = raw.trim();
        const imgMatch = line.match(/!\[[^\]]*\]\(([^)\s]+)\)/);
        if (imgMatch) {
          if (!cur && sections.length === 0 && !imageUrl) imageUrl = imgMatch[1];
          else if (cur) cur.image = cur.image || imgMatch[1];
          if (line.replace(/!\[[^\]]*\]\([^)]+\)/g, '').trim() === '') continue;
        }
        const h = line.match(/^(#{1,6})\s+(.*)$/);
        if (h) { flush(); const t = h[2].trim(); cur = { title: t, content: [], image: '' }; if (!subject) subject = t; continue; }
        if (cur) cur.content.push(line);
        else if (line && !subject) subject = line;
      }
      flush();
      if (!sections.length) sections.push({ title: '', content: lines.join('\n'), image: '' });
      return { subject, imageUrl, sections };
    }
    function parseHtml(text) {
      const doc = new DOMParser().parseFromString(text, 'text/html');
      let subject = doc.title || '';
      let imageUrl = '';

      // 1. 清理：去掉脚本、样式、导航、页眉页脚、广告等无正文价值元素
      const junk = 'script,style,noscript,link,meta,nav,header,footer,aside,form,iframe,svg,button,input,select,textarea,figure,picture,video,audio,canvas,.ad,.ads,.advertisement,.banner,.menu,.sidebar,.footer,.header,.comment,.comments,.share,.related,.recommend,.subscribe,.newsletter,.cookie,.breadcrumb,.social,[role="navigation"],[role="banner"],[role="contentinfo"],[class*="ad-"],[id*="ad-"],[class*="sidebar"],[class*="footer"],[class*="header"],[class*="nav"]';
      junk.split(',').forEach(sel => { try { doc.querySelectorAll(sel).forEach(el => el.remove()); } catch (e) {} });

      const body = doc.body || doc.documentElement;

      // 2. 找正文容器：文本长、链接密度低的块得分高
      let main = body;
      let bestScore = 0;
      body.querySelectorAll('article,main,[role="main"],div,section').forEach(el => {
        const textLen = (el.textContent || '').trim().length;
        if (textLen < 200) return;
        let linkLen = 0;
        el.querySelectorAll('a').forEach(a => { linkLen += (a.textContent || '').length; });
        const score = textLen - linkLen * 3;
        if (score > bestScore) { bestScore = score; main = el; }
      });

      const firstImg = main.querySelector('img') || doc.querySelector('img');
      if (firstImg) imageUrl = firstImg.getAttribute('src') || '';

      // 3. 从正文容器提取标题 + 段落
      const sections = [];
      let cur = null;
      const headings = main.querySelectorAll('h1, h2, h3');
      const walk = (node) => {
        node.childNodes.forEach((child) => {
          if (child.nodeType === 1) {
            const tag = child.tagName.toLowerCase();
            if (tag === 'h1' || tag === 'h2' || tag === 'h3') {
              const t = child.textContent.trim();
              if (t) { cur = { title: t, content: '', image: '' }; if (!subject || subject === doc.title) subject = t; sections.push(cur); }
              return;
            }
            if (tag === 'img') { const src = child.getAttribute('src'); if (src) { if (cur) cur.image = cur.image || src; else if (!imageUrl) imageUrl = src; } return; }
            if (tag === 'script' || tag === 'style' || tag === 'noscript') return;
            walk(child);
          } else if (child.nodeType === 3) {
            const t = child.textContent.trim();
            if (t) { if (cur) cur.content += t + '\n'; }
          }
        });
      };

      if (headings.length) {
        walk(main);
      } else {
        sections.push({ title: '', content: (main.textContent || '').trim(), image: imageUrl });
      }

      sections.forEach(s => { s.content = (s.content || '').trim(); });
      const cleaned = sections.filter(s => s.title || s.content);
      if (!cleaned.length) cleaned.push({ title: '', content: (main.textContent || '').trim(), image: imageUrl });
      return { subject, imageUrl, sections: cleaned };
    }
    function makeEmail(parsed, meta = {}) {
      return {
        id: meta.id || ('m' + Math.random().toString(36).slice(2, 8)),
        senderName: meta.senderName || '导入内容',
        senderEmail: meta.senderEmail || '',
        subject: meta.subject || parsed.subject || '导入内容',
        date: meta.date || '',
        imageUrl: meta.imageUrl || parsed.imageUrl || '',
        subscribed: meta.subscribed !== false,
        sections: parsed.sections || []
      };
    }
    function normalizeSections(sections) {
      if (!Array.isArray(sections)) sections = [];
      return sections.map(s => ({ title: s.title || '', content: (typeof s.content === 'string' ? s.content : '') || '', image: s.image || '' })).filter(s => s.content || s.title);
    }
    function normalizeInput(data) {
      const emails = [];
      if (Array.isArray(data.emails) && data.emails.length) {
        data.emails.forEach((e, i) => emails.push({
          id: e.id || ('e' + i),
          senderName: e.senderName || e.sender || '',
          senderEmail: e.senderEmail || '',
          subject: e.subject || e.title || '',
          date: e.date || '', imageUrl: e.imageUrl || '',
          subscribed: e.subscribed !== false,
          sections: normalizeSections(e.sections || e.content)
        }));
      } else if (data.sections || data.sender || data.subject || data.content) {
        emails.push({
          id: 'e0', senderName: data.sender || data.senderName || '', senderEmail: data.senderEmail || '',
          subject: data.subject || '', date: data.date || '', imageUrl: data.imageUrl || '', subscribed: true,
          sections: normalizeSections(data.sections || (data.content ? [{ content: data.content }] : []))
        });
      }
      return emails;
    }

    // ==================== 分段 ====================
    // 段落：换行处断开；过长的段落每约 5 句再切一段
    function computeParagraphRanges() {
      const paras = [];
      let start = 0;
      let sentenceCount = 0;
      for (let i = 0; i < allWords.length; i++) {
        const isSentenceEnd = /[。！？!?.…；;]/.test(allWords[i].text);
        const isLineBreak = i < allWords.length - 1 && /\n/.test(fullText.slice(allWords[i].end, allWords[i + 1].start));
        if (isSentenceEnd) sentenceCount++;
        const isParaEnd = i === allWords.length - 1 || isLineBreak || sentenceCount >= 5;
        if (isParaEnd) {
          paras.push({ start, end: i });
          start = i + 1;
          sentenceCount = 0;
        }
      }
      return paras;
    }

    // ==================== 播放器构建 ====================
    function buildPlayer(email) {
      stopPlayback();
      selectedWords.clear();
      episodeTitle.textContent = email.subject || email.senderName || '邮件朗读';
      episodeSubtitle.textContent = email.senderName || '发件人';
      imgPlaceholder.textContent = (email.senderName || '邮')[0];
      imgPlaceholder.style.display = 'block';
      episodeImg.style.display = 'none';
      if (email.imageUrl) setEpisodeImage(email.imageUrl);

      const secs = email.sections || [];
      const parts = secs.map(s => (typeof s.content === 'string' ? s.content : ''));
      fullText = parts.join('\n\n');
      let off = 0;
      const charRanges = secs.map(s => {
        const len = (typeof s.content === 'string' ? s.content : '').length;
        const r = { start: off, end: off + len };
        off += len + 2;
        return r;
      });

      allWords = tokenize(fullText);
      paragraphRanges = computeParagraphRanges();

      sectionRanges = secs.map((s, idx) => {
        const cr = charRanges[idx];
        let start = allWords.findIndex(w => w.start >= cr.start);
        if (start < 0) start = 0;
        let end = allWords.length - 1;
        for (let i = allWords.length - 1; i >= 0; i--) if (allWords[i].start < cr.end) { end = i; break; }
        return { start, end, title: s.title, image: s.image, index: idx };
      });

      estimatedDuration = Math.max(10, Math.min(3600, allWords.length * 0.45));
      totalTimeEl.textContent = formatTime(estimatedDuration);

      // 段落标签
      sectionsContainer.innerHTML = '';
      sectionRanges.forEach((range, idx) => {
        const btn = document.createElement('button');
        btn.className = 'section-btn' + (idx === 0 ? ' active' : '');
        btn.textContent = range.title || autoTitle(secs[idx] ? secs[idx].content : '');
        btn.addEventListener('click', () => {
          const wasPlaying = mode === 'playing';
          if (mode === 'playing' || mode === 'paused') stopPlayback();
          currentWordIndex = range.start;
          const progress = allWords.length ? (range.start / allWords.length) * 100 : 0;
          setHighlight(range.start, progress);
          progressBar.value = progress;
          progressBar.style.setProperty('--progress', progress + '%');
          if (wasPlaying) startPlayback();
        });
        sectionsContainer.appendChild(btn);
      });
      updateSectionsToggle();

      // 正文：按段落渲染 <p>
      textContent.innerHTML = '';
      const frag = document.createDocumentFragment();
      paragraphRanges.forEach((para) => {
        const p = document.createElement('p');
        p.className = 'para';
        for (let i = para.start; i <= para.end; i++) {
          const w = allWords[i];
          const span = document.createElement('span');
          span.className = 'word';
          if (/^[A-Za-z][A-Za-z'’-]*$/.test(w.text)) span.classList.add('en');
          span.textContent = w.text;
          span.dataset.index = i;
          if (i < para.end && /[A-Za-z0-9]$/.test(w.text) && /^[A-Za-z0-9]/.test(allWords[i + 1].text)) span.style.marginRight = '4px';
          p.appendChild(span);
        }
        frag.appendChild(p);
      });
      textContent.appendChild(frag);

      currentWordIndex = 0;
      progressBar.value = 0;
      progressBar.style.setProperty('--progress', '0%');
      setHighlight(0, 0);
    }

    function setHighlight(wordIndex, progress) {
      wordIndex = Math.max(0, Math.min(allWords.length - 1, wordIndex));
      currentWordIndex = wordIndex;

      const words = textContent.querySelectorAll('.word');
      words.forEach((w, i) => w.classList.toggle('read', i <= wordIndex));

      if (words[wordIndex]) {
        const rect = words[wordIndex].getBoundingClientRect();
        const container = textContent.parentElement.getBoundingClientRect();
        if (rect.top < container.top || rect.bottom > container.bottom) {
          words[wordIndex].scrollIntoView({ behavior: 'smooth', block: 'center' });
        }
      }

      const range = sectionRanges.find(r => wordIndex >= r.start && wordIndex <= r.end);
      if (range) {
        document.querySelectorAll('.section-btn').forEach((btn, i) => btn.classList.toggle('active', i === range.index));
        if (range.image) setEpisodeImage(range.image);
        else if (currentEmail() && currentEmail().imageUrl) setEpisodeImage(currentEmail().imageUrl);
      }

      const p = (progress === undefined) ? (allWords.length ? (wordIndex / allWords.length) * 100 : 0) : progress;
      currentTimeEl.textContent = formatTime((p / 100) * estimatedDuration);
    }

    function setProgress(progress) {
      progress = Math.max(0, Math.min(100, progress));
      progressBar.value = progress;
      progressBar.style.setProperty('--progress', progress + '%');
      const wordIndex = Math.min(allWords.length - 1, Math.floor((progress / 100) * allWords.length));
      setHighlight(wordIndex, progress);
    }

    // ==================== 播放控制 ====================
    const WORKER = 'https://shiny-lake-6597.mosyfyyy.workers.dev';
    const TTS_API = {
      url: WORKER + '/v1/audio/speech',
      model: 'tts-1',
      enabled: true
    };
    let apiVoice = 'nova';
    let usingApi = false;
    // 字幕与声音的微调：正值字幕提前，负值字幕延后（占一个分块时长的比例）
    let SYNC_OFFSET = 0;

    let apiAudio = null;
    let apiChunks = [];
    let apiChunkIndex = -1;
    let apiNext = null;
    let playbackSession = 0;
    const activeObjectUrls = new Set();
    function releaseAudioUrl(url) {
      if (!url) return;
      try { URL.revokeObjectURL(url); } catch (e) {}
      activeObjectUrls.delete(url);
    }

    // 按句切块：块越小，字幕与声音的误差越小
    // cum[i] = 读到第 i 个词时，应处于本块时长的百分比（按字符长度加权）
    function makeChunk(startWord, endWord) {
      const ws = allWords.slice(startWord, endWord + 1);
      const lens = ws.map(w => Math.max(1, w.text.length));
      let total = 0;
      lens.forEach(l => { total += l; });
      const cum = [];
      let acc = 0;
      for (let k = 0; k < lens.length; k++) { acc += lens[k]; cum.push(acc / total); }
      return {
        startWord, endWord,
        text: joinWords(ws.map(x => x.text)),
        cum: cum
      };
    }

    function buildApiChunks() {
      const chunks = [];
      let startWord = 0;
      let len = 0;
      for (let i = 0; i < allWords.length; i++) {
        const w = allWords[i];
        len += w.text.length + 1;
        const isEnd = /[。！？!?.…；;]/.test(w.text);
        // 遇到句末就断开（最短 8 字符，避免碎片过多）
        if (isEnd && (len >= 8 || i === allWords.length - 1)) {
          chunks.push(makeChunk(startWord, i));
          startWord = i + 1;
          len = 0;
        }
      }
      if (startWord < allWords.length) chunks.push(makeChunk(startWord, allWords.length - 1));
      return chunks;
    }

    function synthesize(text) {
      const ctl = new AbortController();
      const timeout = setTimeout(() => ctl.abort(), 30000);
      return fetch(TTS_API.url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ model: TTS_API.model, input: text, voice: apiVoice, response_format: 'mp3', speed: speed }),
        signal: ctl.signal
      }).then(res => { if (!res.ok) throw new Error('TTS ' + res.status); return res.blob(); })
        .finally(() => clearTimeout(timeout))
        .then(blob => { const url = URL.createObjectURL(blob); activeObjectUrls.add(url); return url; });
    }

    function stopApi() {
      playbackSession++;
      if (apiAudio) { try { apiAudio.pause(); apiAudio.src = ''; } catch (e) {} apiAudio = null; }
      activeObjectUrls.forEach(releaseAudioUrl);
      apiNext = null;
      apiChunkIndex = -1;
    }

    function playChunkAudio(chunk, url) {
      const audio = new Audio(url);
      apiAudio = audio;
      audio.ontimeupdate = () => {
        // 用局部 audio 引用，避免切到下一段时旧回调把字幕拉回去
        if (apiAudio !== audio || mode !== 'playing') return;
        if (!audio.duration || !isFinite(audio.duration)) return;
        let ratio = Math.min(1, audio.currentTime / audio.duration);
        ratio = Math.max(0, Math.min(1, ratio + SYNC_OFFSET));
        // 按字符加权的累计占比查找当前词
        let k = 0;
        const cum = chunk.cum;
        while (k < cum.length - 1 && cum[k] < ratio) k++;
        const wi = chunk.startWord + k;
        const progress = (wi / allWords.length) * 100;
        setHighlight(wi, progress);
        progressBar.value = progress;
        progressBar.style.setProperty('--progress', progress + '%');
      };
      audio.onended = () => { const u = audio.src; releaseAudioUrl(u); if (mode === 'playing' && apiAudio === audio) playApiChunk(); };
      audio.onerror = () => { const u = audio.src; releaseAudioUrl(u); if (mode === 'playing' && apiAudio === audio) playApiChunk(); };
      audio.play().catch(() => {
        // iOS 拦截自动播放：不要启动视觉计时器（否则字幕会跑到声音前面），只提示
        if (mode === 'playing') {
          stopPlayback();
          showHint('请点击播放按钮开始朗读');
        }
      });
    }

    function playApiChunk() {
      if (mode !== 'playing') return;
      apiChunkIndex++;
      if (apiChunkIndex >= apiChunks.length) {
        setHighlight(allWords.length - 1, 100);
        progressBar.value = 100;
        progressBar.style.setProperty('--progress', '100%');
        stopPlayback();
        return;
      }
      const chunk = apiChunks[apiChunkIndex];
      const idx = apiChunkIndex;

      let urlP;
      if (apiNext && apiNext.index === idx) { urlP = Promise.resolve(apiNext.url); apiNext = null; }
      else urlP = synthesize(chunk.text);

      const ni = idx + 1;
      if (ni < apiChunks.length && (!apiNext || apiNext.index !== ni)) {
        synthesize(apiChunks[ni].text).then(u => { if (session === playbackSession && mode === 'playing') apiNext = { index: ni, url: u }; else releaseAudioUrl(u); }).catch(() => {});
      }

      urlP.then(url => {
        if (session !== playbackSession || mode !== 'playing' || apiChunkIndex !== idx) { releaseAudioUrl(url); return; }
        playChunkAudio(chunk, url);
      }).catch(() => {
        if (mode === 'playing') { stopPlayback(); showHint('语音合成失败，请重试'); }
      });
    }

    function startApiPlayback() {
      usingApi = true;
      stopApi();
      const session = playbackSession;
      apiChunks = buildApiChunks();
      let startIdx = 0;
      for (let i = 0; i < apiChunks.length; i++) {
        if (currentWordIndex <= apiChunks[i].endWord) { startIdx = i; break; }
      }
      apiChunkIndex = startIdx - 1;
      mode = 'playing';
      updatePlayButton();
      playApiChunk();
    }

    function updatePlayButton() { playIcon.innerHTML = (mode === 'playing') ? PAUSE_SVG : PLAY_SVG; }

    function stopPlayback() {
      stopApi();
      if (supportsTts) { try { speechSynthesis.cancel(); } catch (e) {} }
      if (fallbackRAF) cancelAnimationFrame(fallbackRAF);
      fallbackRAF = null;
      utterance = null;
      mode = 'stopped';
      updatePlayButton();
    }
    function startFallback() {
      usingApi = false;
      stopApi();
      if (supportsTts) { try { speechSynthesis.cancel(); } catch (e) {} }
      if (fallbackRAF) cancelAnimationFrame(fallbackRAF);
      mode = 'playing';
      fallbackStartTime = Date.now();
      fallbackStartProgress = (currentWordIndex / allWords.length) * 100;
      const tick = () => {
        if (mode !== 'playing') return;
        const elapsed = (Date.now() - fallbackStartTime) / 1000;
        const progress = fallbackStartProgress + (elapsed / (estimatedDuration / speed)) * 100;
        if (progress >= 100) {
          setHighlight(allWords.length - 1, 100);
          progressBar.value = 100;
          progressBar.style.setProperty('--progress', '100%');
          stopPlayback();
        } else {
          setHighlight(Math.floor((progress / 100) * allWords.length), progress);
          progressBar.value = progress;
          progressBar.style.setProperty('--progress', progress + '%');
          fallbackRAF = requestAnimationFrame(tick);
        }
      };
      fallbackRAF = requestAnimationFrame(tick);
      updatePlayButton();
    }

    function startPlayback() {
      if (!allWords.length) return;
      if (currentWordIndex >= allWords.length - 1) currentWordIndex = 0;
      const vp = VOICE_OPTIONS.find(v => v.id === voicePref) || VOICE_OPTIONS[0];
      if (vp.src === 'api') {
        apiVoice = vp.id;
        startApiPlayback();
        return;
      }
      startSiriPlayback(vp.id);
    }

    function startSiriPlayback(siriName) {
      if (!supportsTts) { startFallback(); return; }
      try {
        usingApi = false;
        speechSynthesis.cancel();
        const startChar = allWords[currentWordIndex].start;
        speechStartChar = startChar;
        utterance = new SpeechSynthesisUtterance(fullText.slice(startChar));
        utterance.lang = 'en-US';
        const sv = findSiriVoice(siriName);
        if (sv) { utterance.voice = sv; utterance.lang = sv.lang; }
        utterance.rate = speed;
        let boundaryFired = false;
        utterance.onboundary = (e) => {
          boundaryFired = true;
          const charIndex = speechStartChar + (e.charIndex || 0);
          const wi = wordIndexAtChar(charIndex);
          const progress = fullText.length ? (charIndex / fullText.length) * 100 : 0;
          setHighlight(wi, progress);
          progressBar.value = progress;
          progressBar.style.setProperty('--progress', progress + '%');
        };
        utterance.onend = () => {
          setHighlight(allWords.length - 1, 100);
          progressBar.value = 100;
          progressBar.style.setProperty('--progress', '100%');
          stopPlayback();
        };
        utterance.onerror = (e) => {
          if (e.error !== 'canceled' && e.error !== 'interrupted') { stopPlayback(); startFallback(); }
        };
        mode = 'playing';
        speechSynthesis.speak(utterance);
        updatePlayButton();
        setTimeout(() => {
          if (mode === 'playing' && !boundaryFired) {
            startFallback();
            showHint('未检测到可用语音，已切换为视觉播放');
          }
        }, 2500);
      } catch (e) {
        startFallback();
      }
    }
    function pausePlayback() {
      if (mode !== 'playing') return;
      mode = 'paused';
      if (usingApi) {
        if (apiAudio) { try { apiAudio.pause(); } catch (e) {} }
      } else if (supportsTts) {
        try { speechSynthesis.pause(); } catch (e) {}
      } else if (fallbackRAF) {
        cancelAnimationFrame(fallbackRAF); fallbackRAF = null;
      }
      updatePlayButton();
    }
    function resumePlayback() {
      if (mode !== 'paused') return;
      mode = 'playing';
      if (usingApi) {
        if (apiAudio && apiAudio.src && !apiAudio.ended) {
          const p = apiAudio.play();
          if (p && p.catch) p.catch(() => {});
        } else {
          // 音频还没就绪（还在合成中）：把当前这一段重新走一遍
          apiChunkIndex--;
          playApiChunk();
        }
      } else if (supportsTts) {
        try { speechSynthesis.resume(); } catch (e) {}
      } else {
        startPlayback();
        return;
      }
      updatePlayButton();
    }
    function seekBy(deltaSeconds) {
      if (!allWords.length) return;
      const delta = (deltaSeconds / estimatedDuration) * 100;
      const cur = parseFloat(progressBar.value) || 0;
      const next = Math.max(0, Math.min(100, cur + delta));
      const wasPlaying = (mode === 'playing');
      if (mode === 'playing' || mode === 'paused') stopPlayback();
      setProgress(next);
      if (wasPlaying) startPlayback();
    }
    function applySpeed() {
      if (mode !== 'playing') return;
      const wi = currentWordIndex;
      stopPlayback();
      currentWordIndex = wi;
      startPlayback();
    }
    function tryAutoplay() {
      if (!allWords.length) return;
      startPlayback();
      if (!usingApi && supportsTts) {
        setTimeout(() => {
          if (mode === 'playing' && !speechSynthesis.speaking && !speechSynthesis.pending) {
            stopPlayback();
            showHint('浏览器拦截了自动朗读，请点击播放按钮');
          }
        }, 400);
      }
    }

    // ==================== 列表渲染 ====================
    function renderSenders() {
      const map = new Map();
      state.emails.forEach(e => {
        const key = e.senderEmail || e.senderName;
        if (!key) return;
        if (!map.has(key)) map.set(key, { key, name: e.senderName || e.senderEmail, email: e.senderEmail || '' });
      });
      state.senders = [...map.values()];
      senderChips.innerHTML = '';
      const all = makeChip('全部', null, state.senderFilter === null);
      all.addEventListener('click', () => { state.senderFilter = null; renderSenders(); renderEmailList(); });
      senderChips.appendChild(all);
      state.senders.forEach(s => {
        const c = makeChip(s.name, s.key, state.senderFilter === s.key);
        c.addEventListener('click', () => { state.senderFilter = s.key; renderSenders(); renderEmailList(); });
        senderChips.appendChild(c);
      });
    }
    function makeChip(label, key, active) {
      const b = document.createElement('button');
      b.className = 'chip' + (active ? ' active' : '');
      b.textContent = label;
      return b;
    }
    function renderEmailList() {
      const list = state.emails
        .map((e, i) => ({ e, i }))
        .filter(({ e }) => e.subscribed !== false)
        .filter(({ e }) => !state.senderFilter || (e.senderEmail || e.senderName) === state.senderFilter);
      emailListBody.innerHTML = '';
      if (!list.length) {
        const empty = document.createElement('div');
        empty.className = 'list-empty';
        empty.textContent = '暂无邮件';
        emailListBody.appendChild(empty);
        return;
      }
      list.forEach(({ e, i }) => {
        const item = document.createElement('div');
        item.className = 'email-item' + (i === state.currentEmailIndex ? ' active' : '');
        const sender = document.createElement('div');
        sender.className = 'email-sender';
        sender.textContent = e.senderName || e.senderEmail || '未知发件人';
        const subj = document.createElement('div');
        subj.className = 'email-title';
        subj.textContent = e.subject || '（无主题）';
        item.appendChild(sender);
        item.appendChild(subj);
        if (e.date) {
          const date = document.createElement('div');
          date.className = 'email-date';
          date.textContent = e.date;
          item.appendChild(date);
        }
        item.addEventListener('click', () => {
          if (i === state.currentEmailIndex && mode !== 'stopped') { closeList(); return; }
          loadEmail(i, { autoplay: true });
          closeList();
        });
        emailListBody.appendChild(item);
      });
    }

    // ==================== 邮件加载 ====================
    function loadEmail(index, opts = {}) {
      if (index < 0 || index >= state.emails.length) return;
      state.currentEmailIndex = index;
      buildPlayer(state.emails[index]);
      renderEmailList();
      if (opts.autoplay) {
        // 等渲染完全稳定后再开始，避免解析大正文时进度条乱跳
        setTimeout(() => {
          requestAnimationFrame(() => { tryAutoplay(); });
        }, 350);
      }
    }
    function setEmails(list, opts = {}) {
      state.emails = Array.isArray(list) ? list : [];
      state.senderFilter = null;
      renderSenders();
      renderEmailList();
      if (state.emails.length) loadEmail(0, { autoplay: opts.autoplay !== false });
      else {
        episodeTitle.textContent = '无内容';
        textContent.textContent = '';
        totalTimeEl.textContent = '0:00';
      }
    }
    async function loadFromUrl(url) {
      // 经 Worker 代理抓取，绕开跨域和网络限制
      try {

    let currentCard = null;
    function positionDict(anchorEl) {
      const r = anchorEl.getBoundingClientRect();
      const popW = 280;
      const vw = window.innerWidth, vh = window.innerHeight;
      // 放在单词右下方，尽量不遮住单词本身
      let left = r.right - 24;
      if (left + popW > vw - 8) left = r.left - popW + 24;
      left = Math.max(8, Math.min(left, vw - popW - 8));
      let top = r.bottom + 8;
      if (top + 240 > vh) top = r.top - 260;
      top = Math.max(8, top);
      dictPanel.style.left = left + 'px';
      dictPanel.style.top = top + 'px';
    }

    function closeDict() { dictPanel.classList.remove('open'); }

    // 有道释义通用提取：trs[].tr[].l.i[] = ["释义", ...]
    function extractYoudaoTrs(trs) {
      const out = [];
      (trs || []).forEach(item => {
        (item && item.tr || []).forEach(t => {
          if (t && t.l && t.l.i) {
            const v = Array.isArray(t.l.i) ? t.l.i : [t.l.i];
            v.forEach(s => { if (s) out.push(String(s)); });
          }
        });
      });
      return out;
    }

    function lookupWord(word, idx, anchorEl) {
      const clean = word.replace(/[.,!?;:'"()\[\]…]+$/, '').trim();
      dictWord.textContent = clean;
      dictPhonetic.textContent = '';
      dictCn.innerHTML = '<div style="color:var(--sec)">查询中…</div>';
      dictMeanings.innerHTML = '';
      openDict(anchorEl);
      currentCard = { word: clean, phonetic: '', meanings: [], audio: '', zh: '' };

      // 一次请求拿全：中文释义(ec) + 英文释义(ee) + 音标
      fetch(WORKER + '/v1/youdao?word=' + encodeURIComponent(clean))
        .then(r => r.json())
        .then(d => {
          // 音标
          const ecw = d && d.ec && d.ec.word && d.ec.word[0];
          const simplew = d && d.simple && d.simple.word && d.simple.word[0];
          const phone = (ecw && (ecw.usphone || ecw.ukphone)) || (simplew && (simplew.usphone || simplew.ukphone)) || '';
          if (phone) {
            dictPhonetic.textContent = '美 /' + phone + '/';
            currentCard.phonetic = phone;
          }

          // 中文释义
          dictCn.innerHTML = '';
          const cnLines = ecw ? extractYoudaoTrs(ecw.trs).map(s => s.replace(/^[a-z]+\.\s*/i, '').trim()).filter(Boolean) : [];
          if (cnLines.length) {
            currentCard.zh = cnLines.join('；');
            const t1 = document.createElement('div');
            t1.className = 'dict-pos';
            t1.textContent = '中文释义';
            dictCn.appendChild(t1);
            cnLines.slice(0, 8).forEach((t, i) => {
              const def = document.createElement('div');
              def.className = 'dict-def';
              const num = document.createElement('span');
              num.className = 'num';
              num.textContent = (i + 1) + '.';
              def.appendChild(num);
              def.appendChild(document.createTextNode(t));
              dictCn.appendChild(def);
            });
          }

          // 英文释义（ee 字段）
          dictMeanings.innerHTML = '';
          const eew = d && d.ee && d.ee.word;
          const eeTrs = (eew && eew.trs) || [];
          if (eeTrs.length) {
            const t2 = document.createElement('div');
            t2.className = 'dict-pos';
            t2.textContent = '英文释义';
            t2.style.marginTop = '10px';
            dictMeanings.appendChild(t2);
            eeTrs.slice(0, 4).forEach(grp => {
              const wrap = document.createElement('div');
              wrap.className = 'dict-meaning';
              if (grp.pos) {
                const pos = document.createElement('div');
                pos.className = 'dict-pos';
                pos.textContent = grp.pos;
                wrap.appendChild(pos);
              }
              extractYoudaoTrs([grp]).slice(0, 3).forEach((t, i) => {
                const def = document.createElement('div');
                def.className = 'dict-def';
                const num = document.createElement('span');
                num.className = 'num';
                num.textContent = (i + 1) + '.';
                def.appendChild(num);
                def.appendChild(document.createTextNode(t));
                wrap.appendChild(def);
              });
              dictMeanings.appendChild(wrap);
            });
          }
          if (!dictMeanings.innerHTML) dictMeanings.innerHTML = '';
        })
        .catch(() => {
          dictCn.innerHTML = '<div style="color:var(--sec)">查询失败</div>';
        });
    }

    // 备用词典源（Datamuse，无音标/发音，但稳定）
    function fetchDatamuse(word) {
      fetch('https://api.datamuse.com/words?sp=' + encodeURIComponent(word) + '&md=d&max=5')
        .then(r => r.json())
        .then(data => {
          const defs = (data[0] && data[0].defs) || [];
          currentCard = { word, phonetic: '', meanings: [], audio: '' };
          dictPhonetic.textContent = '';
          dictMeanings.innerHTML = '';
          if (defs.length) {
            defs.slice(0, 5).forEach((d, i) => {
              const parts = d.split('\t');
              const pos = parts.length > 1 ? parts[0] : '';
              const text = parts.length > 1 ? parts.slice(1).join('\t') : d;
              const wrap = document.createElement('div');
              wrap.className = 'dict-meaning';
              if (pos) {
                const p = document.createElement('div');
                p.className = 'dict-pos';
                p.textContent = pos;
                wrap.appendChild(p);
              }
              const def = document.createElement('div');
              def.className = 'dict-def';
              const num = document.createElement('span');
              num.className = 'num';
              num.textContent = (i + 1) + '.';
              def.appendChild(num);
              def.appendChild(document.createTextNode(text));
              wrap.appendChild(def);
              dictMeanings.appendChild(wrap);
            });
          } else {
            dictMeanings.innerHTML = '<div style="color:var(--sec)">未查到释义（词典源不可用，建议用 HTTPS 打开此页）</div>';
          }
        })
        .catch(() => {
          dictMeanings.innerHTML = '<div style="color:var(--sec)">未查到释义（网络异常）</div>';
        });
    }

    function legacyCopy(text) {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.focus(); ta.select();
      try { document.execCommand('copy'); } catch (e) {}
      document.body.removeChild(ta);
    }
    function copyText(text) {
      if (navigator.clipboard && navigator.clipboard.writeText) return navigator.clipboard.writeText(text).catch(() => legacyCopy(text));
      legacyCopy(text);
      return Promise.resolve();
    }
    async function shareOrClipboard(text, hint, shortcutName) {
      await copyText(text);
      if (navigator.share) {
        try { await navigator.share({ text }); showHint(hint); return; }
        catch (e) { /* fallback */ }
      }
      if (shortcutName) {
        const url = 'shortcuts://run-shortcut?name=' + encodeURIComponent(shortcutName) + '&input=text&text=' + encodeURIComponent(text);
        try {
          window.location.href = url;
          showHint('已复制，并尝试打开「' + shortcutName + '」快捷指令');
          return;
        } catch (e) { /* fallback */ }
      }
      showHint('已复制到剪贴板');
    }

    function onPressStart(e) {
      const span = e.target.closest('.word.en');
      if (!span) return;
      const word = span.textContent.trim();
      const idx = parseInt(span.dataset.index, 10);
      if (!word || isNaN(idx)) return;
      pressTarget = { word, idx, el: span };
      pressTriggered = false;
      resumeAfterPress = false;
      pressStartX = e.clientX;
      pressStartY = e.clientY;
      clearTimeout(pressTimer);
      pressTimer = setTimeout(() => {
        pressTriggered = true;
        handleLongPress(pressTarget);
      }, 500);
    }
    function onPressMove(e) {
      if (pressTriggered) return;
      // 移动超过 10px 才算滑动，避免 iPhone 手指轻微抖动导致长按失效
      const dx = (e.clientX || 0) - pressStartX;
      const dy = (e.clientY || 0) - pressStartY;
      if (dx * dx + dy * dy > 100) clearTimeout(pressTimer);
    }
    function onPressEnd(e) {
      clearTimeout(pressTimer);
      if (pressTriggered) {
        pressTriggered = false;
        if (resumeAfterPress) { resumeAfterPress = false; startPlayback(); }
        pressTarget = null;
        return;
      }
      const span = e.target.closest('.word.en');
      if (span) {
        const idx = parseInt(span.dataset.index, 10);
        if (!isNaN(idx) && selectedWords.has(idx)) {
          markSelected(idx, false);
          showHint('已取消高亮');
        }
      }
      pressTarget = null;
    }
    function onPressCancel() {
      clearTimeout(pressTimer);
      pressTriggered = false;
      pressTarget = null;
    }
    function handleLongPress(t) {
      const wasPlaying = (mode === 'playing');
      resumeAfterPress = wasPlaying;
      if (wasPlaying || mode === 'paused') stopPlayback();
      markSelected(t.idx, true);
      speakWord(t.word.replace(/[.,!?;:'"()\[\]…]+$/, ''));
      lookupWord(t.word, t.idx, t.el);

    async function doSaveToObsidian(word) {
      const cfg = getObsidianConfig();
      if (!cfg || !cfg.vault || !cfg.note) return;
      // 中文释义：优先用词典弹窗里已查到的（有道），没有则现查
      let zh = (currentCard && currentCard.word === word && currentCard.zh) ? currentCard.zh : '';
      if (!zh) {
        try {
          const r = await fetch(WORKER + '/v1/youdao?word=' + encodeURIComponent(word));
          const d = await r.json();
          const w = d && d.ec && d.ec.word && d.ec.word[0];
          if (w) {
            const raw = [];
            (w.trs || []).forEach(item => {
              (item && item.tr || []).forEach(t => {

                  values.forEach(s => { if (s) raw.push(String(s)); });

            zh = raw.map(s => s.replace(/^[a-z]+\.\s*/i, '').trim()).filter(Boolean).join('；');
          }
        } catch (e) {}
      }
      const template = cfg.template || OBSIDIAN_TEMPLATE;
      const line = template.replace('{word}', word).replace('{zh}', zh || '').replace(/\s*：\s*$/, '') + '\n';
      await copyText(line);
      const url = 'obsidian://new?vault=' + encodeURIComponent(cfg.vault) +
                  '&file=' + encodeURIComponent(cfg.note) +
                  '&content=' + encodeURIComponent(line) + '&append=true';

    // Base64 解码（支持中文，快捷指令传正文用这个最稳）
    function b64DecodeUtf8(b64) {
      const bin = atob(b64);
      const bytes = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      return new TextDecoder('utf-8').decode(bytes);
    }

    (function init() {
      const rawData = params.get('data');
      const rawText = params.get('text');
      const rawB64 = params.get('b64');
      const rawId = params.get('id');
      const rawUrl = params.get('url');
      if (rawData) {
        try { setEmails(normalizeInput(JSON.parse(rawData))); }
        catch (e) { episodeTitle.textContent = '数据解析失败'; showHint('数据解析失败，请检查传入的 JSON'); }
      } else if (rawId) {
        // 短 ID 方案：内容存在 Worker，这里取回来
        episodeTitle.textContent = '正在读取…';
        fetch(WORKER + '/v1/load?id=' + encodeURIComponent(rawId))
          .then(r => r.text())
          .then(text => {
            if (!text || text === 'not found or expired') throw new Error('empty');
            const parsed = parseContent(text);
            const sender = params.get('sender');
            const subject = params.get('subject');
            setEmails([makeEmail(parsed, {
              senderName: sender || '', subject: subject || ''
            })]);
          })
          .catch(() => {
            episodeTitle.textContent = '内容读取失败';
            showHint('内容已过期或不存在，请重新运行快捷指令');
          });
      } else if (rawB64) {
        try {
          const parsed = parseContent(b64DecodeUtf8(rawB64));
          const sender = params.get('sender');
          const subject = params.get('subject');
          setEmails([makeEmail(parsed, {
              senderName: sender || '', subject: subject || ''
          })]);
        }
        catch (e) { showHint('文本解析失败'); }
      } else if (rawText) {
        try {
          const parsed = parseContent(rawText);
          const sender = params.get('sender');
          const subject = params.get('subject');
          setEmails([makeEmail(parsed, {
              senderName: sender || '', subject: subject || ''
          })]);
        }
        catch (e) { showHint('文本解析失败'); }
      } else if (rawUrl) {
        loadFromUrl(rawUrl);
      } else {
        episodeTitle.textContent = '请传入邮件数据，或点击「导入」读取文本/链接';
        renderSenders();
        renderEmailList();
      }
    })();
  </script>
</body>
